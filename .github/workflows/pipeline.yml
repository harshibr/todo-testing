# Generated for this project by scripts/seed-pipeline.sh (project names, ports and commands are filled in).
#
#  push to staging ->  1 TEST          integrity + security checks, then unit + API + browser tests (same as the local gate)
#                          2 STAGING       deploy to the staging server, then run the FULL API + browser tests against it
#                          3 PROMOTE       merge the tested commit into master
#                          4 LIVE          deploy to the live server, then run ONLY read-only @smoke tests against it
#                          5 ROLLBACK      if the live smoke test fails
#  pull request         ->  1 TEST only
#
# NO-SERVERS MODE: while the repository variable STAGING_URL does not exist, stage 2 is skipped and stage 3 runs right after
# TEST passes (the tests are then the only gate). As soon as you add STAGING_URL the full flow above applies automatically.
# Stages 2, 4, 5 switch themselves on when you add the GitHub repository variables STAGING_URL / LIVE_URL
# (Settings > Secrets and variables > Actions > Variables).
name: pipeline
on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27018:27017"]
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test integrity (code changes need tests; no test deleted, skipped or weakened)
        env: { BASE: "${{ github.event.pull_request.base.sha || github.event.before }}" }
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          if [ -n "$BASE" ]; then AIDEV_BASE="$BASE" bash .github/ci/integrity.sh; else echo "first commit: nothing to compare"; fi
      - name: Security check (secrets, tracked .env files, dependency audit)
        env: { BASE: "${{ github.event.pull_request.base.sha || github.event.before }}" }
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          AIDEV_BASE="${BASE:-HEAD}" bash .github/ci/security.sh
      - name: Install dependencies
        run: bash .github/ci/install.sh
      - name: Unit tests
        run: bash .github/ci/unit.sh
      - name: Start the app
        run: |
          (bash .github/ci/start.sh > app.log 2>&1 &)
          npx --yes wait-on --timeout 120000 http://127.0.0.1:5173/api/todos || { echo "--- app.log ---"; cat app.log; exit 1; }
      - name: API + browser tests (against the app on this machine)
        working-directory: tests
        env: { BASE_URL: "http://127.0.0.1:5173", HEALTH_PATH: "/api/todos" }
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/playwright-report, if-no-files-found: ignore }

  deploy-staging:
    if: github.event_name == 'push' && vars.STAGING_URL != ''
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # ADAPT: put the real deploy here (SSH, rsync, docker, a hosting CLI ...).  e.g.:  ssh deploy@staging 'cd app && deploy/blue-green.sh deploy ${{ github.sha }}'
      - name: Deploy to staging
        run: echo "ADAPT - deploy ${{ github.sha }} to ${{ vars.STAGING_URL }}"
      - name: FULL tests on staging (API + browsers; staging data is disposable)
        working-directory: tests
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          HEALTH_PATH: "/api/todos"
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: staging-report, path: tests/playwright-report }

  promote:
    # runs when: TEST passed AND (staging deploy+tests passed, OR there is no staging server configured)
    if: >-
      always() && github.event_name == 'push' && needs.test.result == 'success' &&
      (needs.deploy-staging.result == 'success' || (needs.deploy-staging.result == 'skipped' && vars.STAGING_URL == ''))
    needs: [test, deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge the tested commit into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          if git merge-base --is-ancestor "${{ github.sha }}" HEAD; then echo "master already contains this commit"; exit 0; fi
          git merge --no-edit -m "Promote ${{ github.sha }} from staging (tests passed)" "${{ github.sha }}" || {
            git merge --abort
            echo "::error::staging conflicts with master. Merge master into staging (scripts/branch-setup.sh does this) and push again."
            exit 1
          }
          git push origin master

  deploy-live:
    if: vars.LIVE_URL != ''
    needs: promote
    runs-on: ubuntu-latest
    environment: production        # add "required reviewers" to this environment in GitHub if you want a human OK before live
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # ADAPT: deploy to live. Blue-green keeps the old version running so rollback is instant.
      - name: Deploy to live
        run: echo "ADAPT - deploy ${{ github.sha }} to ${{ vars.LIVE_URL }}"
      - name: READ-ONLY smoke tests on live (only tests tagged @smoke; they never change data)
        working-directory: tests
        env: { BASE_URL: "${{ vars.LIVE_URL }}" }
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --grep @smoke
      - name: Roll back live
        if: failure()
        run: echo "ADAPT - on the live server run deploy/blue-green.sh rollback"
