# Generated for this project by scripts/seed-pipeline.sh (project names, ports and commands are filled in).
#
#  Nothing here releases by itself: the developer instructs it (scripts/release.sh staging | production | both).
#
#  push to staging (on instruction)  ->  1 TEST          integrity + security checks, unit + API + browser tests on a clean GitHub machine
#                                            2 DEPLOY-STAGING deploy to the staging server + FULL API/browser tests there (needs repository variable STAGING_URL)
#  push to master = "move to production" ->  1 TEST          (the same commit was already green on staging; re-checked)
#                                            2 DEPLOY-LIVE    deploy to the live server, then ONLY read-only @smoke tests; roll back if they fail (needs LIVE_URL)
#  pull request                          ->  1 TEST only
#
# Stages that need a server switch themselves on when you add the repository variables STAGING_URL / LIVE_URL
# (Settings > Secrets and variables > Actions > Variables). Without LIVE_URL, "production" simply means the master branch is updated.
name: pipeline
on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

permissions:
  contents: read
  deployments: read      # to see when Vercel has finished deploying a commit

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27018:27017"]
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test integrity (code changes need tests; no test deleted, skipped or weakened)
        env: { BASE: "${{ github.event.pull_request.base.sha || github.event.before }}" }
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          if [ -n "$BASE" ]; then AIDEV_BASE="$BASE" bash .github/ci/integrity.sh; else echo "first commit: nothing to compare"; fi
      - name: Security check (secrets, tracked .env files, dependency audit)
        env: { BASE: "${{ github.event.pull_request.base.sha || github.event.before }}" }
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          AIDEV_BASE="${BASE:-HEAD}" bash .github/ci/security.sh
      - name: Install dependencies
        run: bash .github/ci/install.sh
      - name: Unit tests
        run: bash .github/ci/unit.sh
      - name: Start the app
        run: |
          (bash .github/ci/start.sh > app.log 2>&1 &)
          npx --yes wait-on --timeout 120000 http://127.0.0.1:5173/api/todos || { echo "--- app.log ---"; cat app.log; exit 1; }
      - name: API + browser tests (against the app on this machine)
        working-directory: tests
        env: { BASE_URL: "http://127.0.0.1:5173", HEALTH_PATH: "/api/todos" }
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/playwright-report, if-no-files-found: ignore }

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && vars.STAGING_URL != ''
    needs: test
    runs-on: ubuntu-latest
    env:
      SITE: ${{ vars.STAGING_URL }}
      API: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Vercel and Render deploy by themselves when staging is pushed. We wait until BOTH run exactly this commit.
      - name: Wait for the deploy (Vercel site + Render API run this commit)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .github/ci/wait-deploy.sh "$SITE" "$API" "${{ github.sha }}"
      - name: FULL tests on the real staging (API + browsers; staging data is disposable)
        working-directory: tests
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          API_URL: ${{ vars.STAGING_API_URL }}
          HEALTH_PATH: "/api/health"
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
          npx playwright test --reporter=list,html,json
      - name: Test proof (summary on the run page)
        if: always()
        run: bash .github/ci/summary.sh "STAGING" "$SITE" "$API" "${{ github.sha }}" tests/results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: staging-report, path: tests/playwright-report, if-no-files-found: ignore }

  deploy-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.LIVE_URL != ''
    needs: test
    runs-on: ubuntu-latest
    environment: production        # add "required reviewers" to this environment in GitHub if you want a human OK before live
    env:
      SITE: ${{ vars.LIVE_URL }}
      API: ${{ vars.LIVE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Wait for the deploy (Vercel site + Render API run this commit)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash .github/ci/wait-deploy.sh "$SITE" "$API" "${{ github.sha }}"
      - name: READ-ONLY smoke tests on live (only tests tagged @smoke; they never change data)
        working-directory: tests
        env:
          BASE_URL: ${{ vars.LIVE_URL }}
          API_URL: ${{ vars.LIVE_API_URL }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project=api --project=chromium --grep "@smoke|commit that was just deployed" --reporter=list,html,json
      - name: Test proof (summary on the run page)
        if: always()
        run: bash .github/ci/summary.sh "LIVE (read-only smoke)" "$SITE" "$API" "${{ github.sha }}" tests/results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-report, path: tests/playwright-report, if-no-files-found: ignore }
      - name: If live is broken
        if: failure()
        run: echo "::error::Live smoke tests failed. Roll back now with scripts/release.sh rollback production (and redeploy the previous version in Vercel or Render if needed)."
